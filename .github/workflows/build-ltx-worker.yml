# Builds the Runpod LTX worker image (workers/ltx) and pushes it to GHCR.
#
# MANUAL ONLY (workflow_dispatch) — never on push. Tags are immutable per commit:
#   ghcr.io/<owner>/<repo>/ltx-worker:<git-sha>          (cu132, the LTX-pinned default)
#   ghcr.io/<owner>/<repo>/ltx-worker:<git-sha>-cu130    (fallback variant, see DEPLOYMENT.md)
# plus, only when asked, a mutable `staging` tag for convenience. There is no `latest`;
# Runpod endpoints must reference the SHA tag (or the digest printed in the run summary).
#
# The build needs no runtime secret: no HF token (weights are never in the image), no Runpod
# key, no S3 credentials. Only the job's own GITHUB_TOKEN, to push the package.
# Third-party actions are pinned to full commit SHAs (tag noted beside each).

name: Build LTX worker image

on:
  workflow_dispatch:
    inputs:
      torch_cuda:
        description: "CUDA variant of the torch/natten wheels (cu132 = LTX v1.4.2 pin; cu130 = Runpod 13.0-host fallback)"
        type: choice
        options: [cu132, cu130]
        default: cu132
      staging_tag:
        description: "Also move the mutable 'staging' tag to this build"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ltx-worker-${{ github.ref }}-${{ inputs.torch_cuda }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python (worker tests)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Worker tests (no GPU, mock engine)
        working-directory: workers/ltx
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -r requirements-test.txt
          python -m pytest

      # The image is ~8 GiB uncompressed (torch + CUDA wheels); hosted runners start with
      # ~14 GiB free on /. Drop preinstalled toolchains the build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Resolve image name and tags
        id: meta
        env:
          TORCH_CUDA: ${{ inputs.torch_cuda }}
          STAGING: ${{ inputs.staging_tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/ltx-worker"
          if [ "$TORCH_CUDA" = "cu132" ]; then
            suffix=""; base="13.2.0-base-ubuntu24.04"
          else
            suffix="-${TORCH_CUDA}"; base="13.0.2-base-ubuntu24.04"
          fi
          tags="${image}:${GITHUB_SHA}${suffix}"
          if [ "$STAGING" = "true" ]; then tags="${tags},${image}:staging${suffix}"; fi
          {
            echo "image=${image}"
            echo "tags=${tags}"
            echo "cuda_base=${base}"
            echo "created=$(git log -1 --format=%cI "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: workers/ltx
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TORCH_CUDA=${{ inputs.torch_cuda }}
            CUDA_BASE_TAG=${{ steps.meta.outputs.cuda_base }}
            WORKER_REVISION=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=ltx-worker-${{ inputs.torch_cuda }}
          cache-to: type=gha,mode=max,scope=ltx-worker-${{ inputs.torch_cuda }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### LTX worker image"
            echo "- tags: \`${TAGS}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- worker revision: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
