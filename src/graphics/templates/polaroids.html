<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../theme.css">
<style>
  .pol {
    position: absolute; box-sizing: border-box; padding: 22px 22px 0;
    background: linear-gradient(160deg, #f7f3ea 0%, #ede6d6 100%);
    box-shadow: 0 2px 0 rgba(0,0,0,0.05), 0 26px 50px rgba(0, 0, 0, 0.38), 0 6px 14px rgba(0,0,0,0.18);
  }
  .photo {
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #e2ddd2 0%, #c5bdae 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), inset 0 0 40px rgba(60, 40, 10, 0.18);
  }
  .photo img { position: absolute; inset: 9%; width: 82%; height: 82%; object-fit: contain; filter: drop-shadow(0 12px 10px rgba(0,0,0,0.3)); }
  .cap { height: 92px; display: flex; align-items: center; justify-content: center; font-family: var(--f-serif); font-style: italic; color: #2b241b; text-align: center; transform: rotate(-1.5deg); }
  .tag {
    position: absolute; left: 110px; top: 96px; padding: 12px 22px 11px;
    background: #efe6d2; color: var(--text-dark);
    font-family: var(--f-mono); font-weight: 500; font-size: 18px; letter-spacing: 0.24em; text-transform: uppercase;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25); transform: rotate(-2deg);
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../runtime.js"></script>
<script>
/*
 * polaroids — snapshots dropped one by one onto a table, each with a handwritten-style caption
 * (refs 02:12, 07:48, 10:00). Layouts are fixed per count so nothing random is involved.
 */
const LAYOUTS = {
  1: [[960, 520, -3]],
  2: [[650, 520, -6], [1270, 540, 5]],
  3: [[520, 470, -6], [1400, 450, 5], [960, 620, -2]],
  4: [[460, 500, -6], [830, 600, 4], [1150, 440, -3], [1490, 560, 6]],
  5: [[360, 440, -6], [700, 640, 4], [1000, 420, -3], [1320, 640, 5], [1600, 430, -4]],
};
const WIDTH = { 1: 520, 2: 470, 3: 420, 4: 360, 5: 330 };

window.__template = {
  async setup(stage, data, ctx) {
    const { el, animate, scheduleEntries } = GR;
    const D = ctx.durationMs;
    const n = data.photos.length;
    const W = WIDTH[n];

    if (data.label) {
      const tag = el("div", "tag", stage, data.label);
      animate(tag, [{ opacity: 0, transform: "rotate(-2deg) translateY(-12px)" }, { opacity: 1, transform: "rotate(-2deg) translateY(0)" }], { start: 0, duration: 500 });
    }

    const times = scheduleEntries(data.photos, ctx.words, D, { windowStartMs: data.label ? 400 : 150 });
    for (let i = 0; i < n; i++) {
      const p = data.photos[i];
      const [cx, cy, r] = LAYOUTS[n][i];
      const pol = el("div", "pol", stage);
      pol.style.width = W + "px";
      const photo = el("div", "photo", pol);
      photo.style.height = Math.round((W - 44) * 0.86) + "px";
      const img = el("img", "", photo);
      img.src = p.image;
      await img.decode();
      const cap = el("div", "cap", pol, p.caption);
      cap.style.fontSize = Math.round(W / 14) + "px";
      pol.style.left = (cx - W / 2) + "px";
      pol.style.top = (cy - pol.offsetHeight / 2) + "px";
      animate(pol, [
        { opacity: 0, transform: "translateY(-70px) scale(1.16) rotate(" + (r + 9) + "deg)" },
        { opacity: 1, transform: "translateY(0) scale(1) rotate(" + r + "deg)" },
      ], { start: times[i], duration: 560, easing: "cubic-bezier(.25,.8,.3,1.05)" });
    }
  },
};
</script>
</body>
</html>
