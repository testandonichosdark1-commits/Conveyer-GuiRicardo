<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../theme.css">
<style>
  .corner { width: 64px; height: 64px; border-color: var(--gold-line); border-style: solid; border-width: 0; }
  .corner.tl { border-top-width: 4px; border-left-width: 4px; }
  .corner.tr { border-top-width: 4px; border-right-width: 4px; }
  .corner.bl { border-bottom-width: 4px; border-left-width: 4px; }
  .corner.br { border-bottom-width: 4px; border-right-width: 4px; }
  .label {
    font-family: var(--f-mono); font-weight: 500; font-size: 19px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 14px;
  }
  .label::before { content: ""; width: 10px; height: 10px; background: var(--gold-line); display: block; }
  .qt { display: flex; align-items: center; }
  .qt-inner {
    position: relative; width: 100%;
    font-family: var(--f-title); font-weight: 600; text-transform: uppercase;
    line-height: 1.04; letter-spacing: 0.01em;
  }
  .w { white-space: nowrap; }
  .c { visibility: hidden; }
  .c.on { visibility: visible; }

  /* outline-fill: hollow letters, highlights solid gold; the rest fills at the end */
  .outline .c { color: rgba(var(--ink-rgb), var(--fill-a, 0)); -webkit-text-stroke: 2.4px var(--stroke); }
  .outline .w.hl .c { color: var(--gold-text); -webkit-text-stroke: 2.4px var(--gold-text); }
  /* typewriter: solid letters, highlights larger and gold (the stacked look of ref 00:39) */
  .solid .c { color: var(--ink); }
  .solid .w.hl { font-size: 1.3em; }
  .solid .w.hl .c { color: var(--gold-text); }

  .caret { position: absolute; width: 6px; background: var(--gold-line); }
  .ruler {
    height: 28px;
    background:
      linear-gradient(var(--faint), var(--faint)) 0 0 / 100% 2px no-repeat,
      repeating-linear-gradient(90deg, var(--faint) 0 2px, transparent 2px 80px) 0 2px / 100% 24px no-repeat,
      repeating-linear-gradient(90deg, var(--faint) 0 2px, transparent 2px 16px) 0 2px / 100% 12px no-repeat;
  }
  .bar { height: 7px; background: var(--gold-line); transform-origin: 0 50%; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../runtime.js"></script>
<script>
/*
 * kinetic_quote — a short line typed letter by letter inside a cornered frame with a ruler
 * (refs 00:12, 01:15, 10:30). Each word is typed while it is spoken (word timings), and the
 * gold bar under the ruler fills with the typing. outline-fill: hollow letters, highlights
 * solid gold, everything filled at the end. typewriter: solid letters, highlights big gold.
 */
window.__template = {
  async setup(stage, data, ctx) {
    const { el, animate, onSeek, fitText, tokenize, typingSchedule, highlightMask } = GR;
    const D = ctx.durationMs;
    const outline = (data.style || "outline-fill") === "outline-fill";
    const F = { x: 170, y: 270, w: 1580, h: 520 };

    if (data.label) {
      const label = el("div", "abs label", stage, data.label);
      label.style.left = F.x + "px"; label.style.top = (F.y - 50) + "px";
      animate(label, [{ opacity: 0 }, { opacity: 1 }], { start: 0, duration: 500 });
    }
    [["tl", 0, 0, -1, -1], ["tr", 1, 0, 1, -1], ["bl", 0, 1, -1, 1], ["br", 1, 1, 1, 1]].forEach(([k, ax, ay, dx, dy]) => {
      const c = el("div", "abs corner " + k, stage);
      c.style.left = (F.x + ax * (F.w - 64)) + "px";
      c.style.top = (F.y + ay * (F.h - 64)) + "px";
      animate(c, [
        { opacity: 0, transform: "translate(" + dx * 22 + "px," + dy * 22 + "px)" },
        { opacity: 1, transform: "translate(0,0)" },
      ], { start: 0, duration: 600 });
    });

    const ruler = el("div", "abs ruler", stage);
    ruler.style.left = (F.x + 40) + "px"; ruler.style.top = (F.y + F.h + 24) + "px"; ruler.style.width = (F.w - 80) + "px";
    const bar = el("div", "abs bar", stage);
    const barW = F.w - 80;
    bar.style.left = (F.x + 40) + "px"; bar.style.top = (F.y + F.h + 60) + "px";
    animate(ruler, [{ opacity: 0 }, { opacity: 1 }], { start: 100, duration: 500 });

    // ── text ──
    const box = el("div", "abs qt " + (outline ? "outline" : "solid"), stage);
    box.style.left = (F.x + 60) + "px"; box.style.top = (F.y + 60) + "px";
    box.style.width = (F.w - 120) + "px"; box.style.height = (F.h - 120) + "px";
    const inner = el("div", "qt-inner", box);
    const tokens = tokenize(data.text);
    const hl = highlightMask(tokens, data.highlight || []);
    const chars = [];
    const words = tokens.map((t, i) => {
      if (i) inner.appendChild(document.createTextNode(" "));
      const w = el("span", "w" + (hl[i] ? " hl" : ""), inner);
      const cs = Array.from(t).map((ch) => el("span", "c", w, ch));
      chars.push(cs);
      return w;
    });
    fitText(inner, 150, 56, F.w - 120, F.h - 120);
    const caret = el("div", "caret", inner);

    const sched = typingSchedule(tokens, ctx.words, D);
    const flat = [];
    const times = [];
    sched.forEach((s, i) => {
      const cs = chars[i], L = cs.length;
      cs.forEach((c, k) => { flat.push(c); times.push(s.startMs + ((s.endMs - s.startMs) * k) / Math.max(1, L)); });
    });
    const typingEnd = sched.length ? sched[sched.length - 1].endMs : 0;
    const fillAt = typingEnd + 350;
    const fillEnd = outline && data.fillAtEnd !== false;

    let shown = -1;
    onSeek((ms) => {
      let n = 0;
      while (n < times.length && times[n] <= ms) n++;
      if (n !== shown) {
        for (let i = 0; i < flat.length; i++) flat[i].classList.toggle("on", i < n);
        shown = n;
      }
      // width, not scaleX: a transformed layer is rasterized at whatever scale the compositor
      // cached, so its edge depended on the frames seeked before — not a function of ms alone.
      bar.style.width = (barW * (flat.length ? n / flat.length : 1)).toFixed(1) + "px";
      // caret: after the last typed letter; solid while typing, blinking after, gone at 1.2 s
      const typing = n < flat.length;
      const visible = typing || (ms - typingEnd < 1200 && Math.floor((ms - typingEnd) / 500) % 2 === 0);
      caret.style.display = visible && flat.length ? "block" : "none";
      if (visible && flat.length) {
        const ref = n > 0 ? flat[n - 1] : flat[0];
        const h = ref.offsetHeight;
        caret.style.height = (h * 0.78).toFixed(1) + "px";
        caret.style.top = (ref.offsetTop + h * 0.11).toFixed(1) + "px";
        caret.style.left = (n > 0 ? ref.offsetLeft + ref.offsetWidth + 6 : ref.offsetLeft - 12) + "px";
      }
      if (fillEnd) {
        const a = Math.min(1, Math.max(0, (ms - fillAt) / 500));
        inner.style.setProperty("--fill-a", a.toFixed(3));
      }
    });
  },
};
</script>
</body>
</html>
