<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../theme.css">
<style>
  .card {
    position: absolute; width: 780px; box-sizing: border-box; padding: 58px 66px 54px;
    background-color: #efe6d2;
    background-image:
      radial-gradient(ellipse 120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(120, 90, 40, 0.18) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='13' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.16  0 0 0 0.12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    box-shadow: inset 0 0 0 14px #efe6d2, inset 0 0 0 16px rgba(110, 88, 56, 0.55), inset 0 0 0 20px #efe6d2, inset 0 0 0 21px rgba(110, 88, 56, 0.35), 0 34px 70px rgba(0, 0, 0, 0.42);
    color: var(--text-dark);
  }
  .ov { font-family: var(--f-mono); font-size: 15px; letter-spacing: 0.3em; text-transform: uppercase; color: #8a7a5f; text-align: center; }
  .ttl { font-family: var(--f-title); font-weight: 600; font-size: 56px; text-transform: uppercase; text-align: center; margin-top: 10px; line-height: 1.02; }
  .st { font-family: var(--f-serif); font-style: italic; font-size: 28px; color: #6b5e4a; text-align: center; margin-top: 6px; }
  .sep { height: 2px; background: rgba(110, 88, 56, 0.35); margin: 26px 0 14px; }
  .item { display: flex; align-items: center; gap: 20px; margin: 16px 0; }
  .box { position: relative; flex: none; width: 30px; height: 30px; border: 2px solid rgba(30,26,21,0.7); box-sizing: border-box; }
  .box svg { position: absolute; left: -4px; top: -6px; overflow: visible; }
  .mk { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .mk.ok { stroke: var(--text-dark); }
  .mk.no { stroke: var(--stamp-red); }
  .it { position: relative; font-family: var(--f-serif); font-size: 33px; line-height: 1.1; }
  .note { font-style: italic; font-size: 26px; color: #6b5e4a; }
  .strike { position: absolute; left: -2px; right: -2px; top: 56%; height: 3px; background: var(--stamp-red); transform-origin: 0 50%; }
  .crossed .it { color: #8b4a40; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../runtime.js"></script>
<script>
/*
 * checklist_card — a paper card that settles in at a slight angle; items enter one by one and
 * get their mark (✓, or a red ✗ with the line struck through), with an optional stamp (refs
 * 06:06, 09:00, 12:57).
 */
window.__template = {
  async setup(stage, data, ctx) {
    const { el, animate, scheduleEntries } = GR;
    const D = ctx.durationMs;
    const NS = "http://www.w3.org/2000/svg";
    const hasImg = !!data.image;
    if (!data.bg) document.body.classList.replace("bg-dark", hasImg ? "bg-dark" : "bg-parchment");

    if (hasImg) {
      const prod = await GR.product(stage, data.image, { cx: 500, cy: 470, w: 640, h: 340 });
      animate(prod.entry, [{ opacity: 0, transform: "translateX(-40px)" }, { opacity: 1, transform: "translateX(0)" }], { start: 0, duration: 800 });
      animate(prod.shadow, [{ opacity: 0 }, { opacity: 1 }], { start: 0, duration: 800 });
    }

    const holder = el("div", "abs", stage);
    const card = el("div", "card", holder);
    if (data.overline) el("div", "ov", card, data.overline);
    el("div", "ttl", card, data.title);
    if (data.subtitle) el("div", "st", card, data.subtitle);
    el("div", "sep", card);
    const rows = data.items.map((it) => {
      const row = el("div", "item" + (it.state === "cross" ? " crossed" : ""), card);
      const box = el("div", "box", row);
      const txt = el("div", "it", row);
      txt.appendChild(document.createTextNode(it.text));
      if (it.note) { txt.appendChild(document.createTextNode(" ")); el("span", "note", txt, "(" + it.note + ")"); }
      let mark = null, strike = null;
      if (it.state !== "empty") {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("width", "40"); svg.setAttribute("height", "40");
        const p = document.createElementNS(NS, "path");
        p.setAttribute("class", "mk " + (it.state === "check" ? "ok" : "no"));
        p.setAttribute("d", it.state === "check" ? "M7 21 L15 30 L35 6" : "M8 10 L32 34 M32 10 L8 34");
        p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1";
        svg.appendChild(p); box.appendChild(svg);
        mark = p;
      }
      if (it.state === "cross") strike = el("div", "strike", txt);
      return { row, mark, strike };
    });

    const cx = hasImg ? 1300 : 960;
    const h = card.offsetHeight;
    holder.style.left = (cx - 390) + "px";
    holder.style.top = Math.max(60, 540 - h / 2) + "px";
    const rot = hasImg ? 1.5 : -2;
    animate(card, [
      { opacity: 0, transform: "translateY(70px) rotate(" + (rot - 5) + "deg)" },
      { opacity: 1, transform: "translateY(0) rotate(" + rot + "deg)" },
    ], { start: 0, duration: 750 });

    const times = scheduleEntries(data.items, ctx.words, D, { windowStartMs: 800 });
    rows.forEach((r, i) => {
      const t = times[i];
      animate(r.row, [{ opacity: 0, transform: "translateX(-14px)" }, { opacity: 1, transform: "translateX(0)" }], { start: t, duration: 400 });
      if (r.mark) animate(r.mark, [{ strokeDashoffset: "1" }, { strokeDashoffset: "0" }], { start: t + 420, duration: 320 });
      if (r.strike) animate(r.strike, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { start: t + 700, duration: 350 });
    });

    if (data.stamp) {
      const last = times[times.length - 1];
      GR.stamp(card, data.stamp, ctx.words, { x: 780 - 150, y: h - 70, rotate: -6, small: true, maxWidth: 260, start: Math.min(D - 600, last + 1100) });
    }
  },
};
</script>
</body>
</html>
